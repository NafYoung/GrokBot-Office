<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>YOUNG NAF · Bot Office</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body data-ambience="night">
  <div id="viewport"></div>

  <header class="hud-brand">
    <div class="brand-row">
      <h1>YOUNG NAF · Bot Office</h1>
      <span class="sim-tag">Simulation</span>
    </div>
    <div class="status-line" id="statusLine">
      <span><strong id="statWorking">0</strong> working</span>
      <span class="sep">•</span>
      <span><strong id="statNeed">0</strong> need you</span>
      <span class="sep">•</span>
      <span><strong id="statIdle">0</strong> idle</span>
      <span class="sep">•</span>
      <span><strong id="statDesks">16</strong> desks</span>
    </div>
  </header>

  <aside class="legend" aria-label="Status legend">
    <div class="leg"><span class="dot c-coding"></span>Coding</div>
    <div class="leg"><span class="dot c-term"></span>In terminal</div>
    <div class="leg"><span class="dot c-need"></span>Needs you</div>
    <div class="leg"><span class="dot c-browse"></span>Browsing</div>
    <div class="leg"><span class="dot c-think"></span>Thinking</div>
    <div class="leg"><span class="dot c-error"></span>Error</div>
  </aside>

  <div class="ambience" role="group" aria-label="Lighting">
    <button type="button" data-amb="day">Day</button>
    <button type="button" data-amb="evening">Evening</button>
    <button type="button" data-amb="night" class="on">Night</button>
  </div>

  <button type="button" class="stop-btn" id="stopBtn" aria-pressed="false">
    <span class="stop-icon"></span> Stop Simulation
  </button>

  <aside class="sidebar">
    <section class="side-block team-block">
      <h2>Team</h2>
      <div class="team-list" id="teamList"></div>
    </section>
    <section class="side-block activity-block">
      <h2>Activity</h2>
      <div class="activity-log" id="activityLog"></div>
    </section>
  </aside>

  <aside class="panel" id="panel" hidden>
    <button class="panel-close" id="panelClose" aria-label="关闭">×</button>
    <div class="panel-avatar" id="panelAvatar"></div>
    <h2 id="panelName"></h2>
    <p class="panel-role" id="panelRole"></p>
    <label class="field">
      <span>留言（可选）</span>
      <textarea id="panelMsg" rows="3" placeholder="唤醒后想说的话…"></textarea>
    </label>
    <button class="call-btn" id="callBtn">
      <span>呼叫 Bot</span>
    </button>
    <p class="panel-status" id="panelStatus" role="status"></p>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <div id="nameLabels" aria-hidden="true"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>

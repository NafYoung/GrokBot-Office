<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1020" />
  <link rel="icon" href="data:," />
  <title>YOUNG NAF 的 Bot 办公室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div id="demoBanner" class="demo-banner hidden" role="status">演示模式 · 以下是示例数据，不是实时状态</div>
    <main class="stage">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <b id="title">YOUNG NAF 的 Bot 办公室</b>
          <span class="badge" id="modeBadge">等待事件</span>
        </div>
        <div class="stats" id="stats"></div>
        <p class="feed-banner" id="feedBanner">正在连接事件流…</p>
      </header>

      <canvas id="office" aria-label="等距办公室"></canvas>

      <div class="roster-strip" id="strip"></div>

      <div class="legend" id="legend"></div>

      <div class="tod" id="tod">
        <button type="button" data-mode="now" class="on">此刻</button>
        <button type="button" data-mode="day">白天</button>
        <button type="button" data-mode="evening">黄昏</button>
        <button type="button" data-mode="night">夜里</button>
      </div>

      <div class="demo-controls">
        <button type="button" class="sim" id="restBtn" aria-pressed="false">看看休息日常</button>
        <button type="button" class="sim" id="demoBtn">进入演示模式</button>
      </div>
    </main>

    <aside class="side">
      <div class="owner">
        <span class="avatar" id="ownerAvatar">N</span>
        <b id="ownerName">YOUNG NAF</b>
        <span class="badge" id="ownerBadge">等待事件</span>
      </div>
      <form class="card auth-card" id="authForm" hidden>
        <label for="officeToken">办公室口令</label>
        <p class="hint">解锁后可查看实时状态和最近活动。</p>
        <input id="officeToken" type="password" autocomplete="current-password" required />
        <button type="submit">解锁办公室</button>
        <p id="authMessage" role="alert"></p>
      </form>
      <details class="card integration-card" id="integrationCard">
        <summary>连接 Grokbot 的真实任务</summary>
        <p class="hint">生成与这台电脑、当前端口对应的上报规则，再保存到需要同步的 Bot 长期指令中。</p>
        <button type="button" id="generateIntegration">生成接入指令</button>
        <p id="integrationMessage" class="hint" role="status"></p>
        <label for="integrationInstructions" id="integrationLabel" hidden>复制给 Grokbot 的配置说明（不含口令）</label>
        <textarea id="integrationInstructions" rows="9" readonly hidden></textarea>
        <button type="button" id="copyIntegration" hidden>复制接入指令</button>
      </details>
      <section class="card selected-card" id="selected">
        <p class="hint">点小人、工位或名单，查看工作内容与新鲜度。</p>
      </section>
      <section class="card">
        <h3>主工位 <span id="teamCount">8</span></h3>
        <ul id="team"></ul>
      </section>
      <section class="card">
        <h3>按需助手 / 工具</h3>
        <ul id="aux"></ul>
      </section>
      <section class="card grow">
        <h3>最近活动 <span class="muted" id="actMode">实时</span></h3>
        <ul id="activity"></ul>
      </section>
    </aside>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
